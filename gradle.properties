org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true
# Minecraft 26.x needs JDK 25 (Homebrew keg-only install). Remove or change this line on other machines.
org.gradle.java.home=/opt/homebrew/opt/openjdk/libexec/openjdk.jdk/Contents/Home

# Fabric Properties (https://fabricmc.net/develop)
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.18-SNAPSHOT

# Mod Properties
version=0.1.0
group=dev.horsingaround

# Dependencies
fabric_api_version=0.162.0+26.3

# Optional integration (compile) and dev runtime: Mod Menu settings screen
modmenu_version=21.0.0
placeholder_api_version=3.2.0+26.3

# Dev runtime: Horsing Around, built in the sibling folder, for riding tests (optional)
horsing_around_libs=../Horsing Around/build/libs
